# Transports, routing targets and the failure path of koh_async.
#
# TYPO3 ships two transports: `default` (synchronous) and `doctrine` (queue
# `default` in sys_messenger_messages). Transports can only be declared here,
# as services -- TYPO3_CONF_VARS only routes messages to them -- which is why
# the switch, the transports and the routing live in one extension rather than
# being split between this file and the project configuration.
#
#   koh_async_mail    queue `mail`: rendered mails waiting for the SMTP server
#   koh_async_failed  queue `failed`: messages that used up their retries
#
# A message routed here is only ever read by `messenger:consume koh_async_mail`.
# ext_localconf.php routes to it only when MESSENGER_ASYNC=1, which the
# platform sets together with that consumer.
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Koh\Typo3Async\:
    resource: '../Classes/*'

  Koh\Typo3Async\Domain\AsyncMode:
    factory: ['Koh\Typo3Async\Domain\AsyncMode', 'fromEnvironment']

  koh_async.transport.mail:
    class: Symfony\Component\Messenger\Bridge\Doctrine\Transport\DoctrineTransport
    factory: ['@TYPO3\CMS\Core\Messenger\DoctrineTransportFactory', 'createTransport']
    arguments:
      $options:
        queue_name: 'mail'
    tags:
      - name: 'messenger.sender'
        identifier: 'koh_async_mail'
      - name: 'messenger.receiver'
        identifier: 'koh_async_mail'

  koh_async.transport.failed:
    class: Symfony\Component\Messenger\Bridge\Doctrine\Transport\DoctrineTransport
    factory: ['@TYPO3\CMS\Core\Messenger\DoctrineTransportFactory', 'createTransport']
    arguments:
      $options:
        queue_name: 'failed'
    tags:
      - name: 'messenger.sender'
        identifier: 'koh_async_failed'
      - name: 'messenger.receiver'
        identifier: 'koh_async_failed'

  # Three retries, 30 s, 60 s and 120 s apart: long enough for a mail server
  # that restarts, short enough that a password-reset mail is not useless when
  # it arrives.
  koh_async.retry.mail:
    class: Symfony\Component\Messenger\Retry\MultiplierRetryStrategy
    arguments:
      $maxRetries: 3
      $delayMilliseconds: 30000
      $multiplier: 2

  Koh\Typo3Async\Infrastructure\Messenger\RetryFailedMessage:
    arguments:
      $sendersLocator: !service_locator
        koh_async_mail: '@koh_async.transport.mail'
      $retryStrategyLocator: !service_locator
        koh_async_mail: '@koh_async.retry.mail'

  Koh\Typo3Async\Infrastructure\Messenger\ParkFailedMessage:
    arguments:
      $failureSenders: !service_locator
        koh_async_mail: '@koh_async.transport.failed'

  # The decorator sits in front of every consumer of TYPO3's MailerInterface.
  Koh\Typo3Async\Infrastructure\Mail\AsyncMailer:
    decorates: TYPO3\CMS\Core\Mail\MailerInterface
    arguments:
      $inner: '@.inner'
      $bus: '@messenger.bus.default'

  # The handler gets the undecorated mailer, or a queued mail would be queued
  # again in the consumer.
  Koh\Typo3Async\Infrastructure\Mail\SendEmailHandler:
    arguments:
      $mailer: '@Koh\Typo3Async\Infrastructure\Mail\AsyncMailer.inner'
    tags:
      - name: 'messenger.message_handler'
